<title>Карта ЖК Миррион</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: toolbar on top, SVG map filling the stage, district card on the right (bottom sheet on phones). */
:root {
  --bg: #EDF0F2;
  --surface: #FFFFFF;
  --ink: #14222B;
  --muted: #55656F;
  --line: #D2D9DF;
  --accent: #17566B;
  --accent-ink: #FFFFFF;
  --map: #E3E8EC;
  --edge: #FFFFFF;
  --halo: #E3E8EC;
  --s1: #23216B;
  --s2: #4A48A6;
  --s3: #7D80CE;
  --s4: #B3B7E8;
  --s5: #D9DDE7;
  --p1: #E6B53C;
  --p2: #E58A33;
  --p3: #CC4A2B;
  --p4: #8A1E3A;
  --p5: #4B2A8C;
  --danger: #A33A2E;
  --shadow: 0 1px 2px rgba(20,34,43,.08), 0 10px 28px rgba(20,34,43,.14);
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151A; --surface: #17222A; --ink: #E5ECF0; --muted: #8FA1AC; --line: #2A3943;
    --accent: #7CC8DA; --accent-ink: #0E151A; --map: #0A1015; --edge: #0A1015; --halo: #0A1015;
    --s1: #C3C5FF; --s2: #8E91E8; --s3: #6064BE; --s4: #403F86; --s5: #262C3C;
    --p1: #F2CD6B; --p2: #F0A357; --p3: #EC7A5A; --p4: #F2557C; --p5: #B79CF2;
    --danger: #F08A7C; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151A; --surface: #17222A; --ink: #E5ECF0; --muted: #8FA1AC; --line: #2A3943;
  --accent: #7CC8DA; --accent-ink: #0E151A; --map: #0A1015; --edge: #0A1015; --halo: #0A1015;
  --s1: #C3C5FF; --s2: #8E91E8; --s3: #6064BE; --s4: #403F86; --s5: #262C3C;
  --p1: #F2CD6B; --p2: #F0A357; --p3: #EC7A5A; --p4: #F2557C; --p5: #B79CF2;
  --danger: #F08A7C; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="option"]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 12px; }

.top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
.title { margin: 0; font-size: 15px; font-weight: 600; }
.count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.search { position: relative; flex: 1 1 240px; max-width: 340px; min-width: 0; }
.search input {
  width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface);
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.results {
  position: absolute; z-index: 20; left: 0; right: 0; top: 40px; max-height: 300px; overflow: auto; margin: 0; padding: 4px;
  list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
}
.results li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover, .results li.act { background: var(--bg); }
.results .ao { color: var(--muted); font-variant-numeric: tabular-nums; }
.results .none { color: var(--muted); cursor: default; }

.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; scrollbar-width: thin; padding-block: 2px; }
.controls .chips.okrug { flex: 1 1 320px; flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.chip[hidden] { display: none; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.sw { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
[data-seg="elite"].sw, .dist[data-seg="elite"] { fill: var(--s1); background: var(--s1); }
[data-seg="premium"].sw, .dist[data-seg="premium"] { fill: var(--s2); background: var(--s2); }
[data-seg="bizplus"].sw, .dist[data-seg="bizplus"] { fill: var(--s3); background: var(--s3); }
[data-seg="other"].sw, .dist[data-seg="other"] { fill: var(--s5); background: var(--s5); }
.segrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.segrow .label { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.hint { margin-left: auto; color: var(--muted); font-size: 12px; }

.stage { position: relative; flex: 1; min-height: 0; display: flex; gap: 12px; }
.mapwrap { position: relative; flex: 1; min-width: 0; background: var(--map); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.dist { stroke: var(--edge); stroke-width: .7px; vector-effect: non-scaling-stroke; cursor: pointer; transition: opacity .15s; }
.dist.dim { opacity: .16; pointer-events: none; }
#hl, #selp { fill: none; pointer-events: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#hl { stroke: var(--ink); stroke-width: 1.6px; }
#selp { stroke: var(--accent); stroke-width: 3px; }
.lbl { font-family: var(--f-body); font-size: 11px; font-weight: 500; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lbl.big { font-size: 13px; font-weight: 600; }

.zoom { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button {
  width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.zoom button:hover { border-color: var(--muted); }
.zoom svg { width: 16px; height: 16px; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; padding: 7px 10px; border-radius: 8px; max-width: 240px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.35;
}
.tip b { display: block; font-size: 13.5px; }
.tip .sw { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.tip[hidden] { display: none; }

.panel { width: 340px; flex: none; overflow: auto; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.pname { margin: 2px 0 0; font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.pclose { display: none; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; align-items: center; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 7px; }
.segsel { height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12.5px; text-align: left; }
.sect { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sect h3 { margin: 0; font-size: 13px; font-weight: 600; }
.empty { color: var(--muted); margin: 0; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.note { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--bg); border-radius: 8px; min-width: 0; }
.note .meta { display: flex; gap: 8px; color: var(--muted); font-size: 12px; align-items: baseline; }
.note .meta .who { color: var(--ink); font-weight: 600; }
.note .meta .del { margin-left: auto; }
.note p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.compose { display: flex; flex-direction: column; gap: 8px; }
.compose textarea { width: 100%; min-height: 76px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; }
.btn { align-self: flex-start; height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.status { min-height: 18px; color: var(--muted); font-size: 12.5px; }
.status.err { color: var(--danger); }
.src { margin-top: auto; color: var(--muted); font-size: 12px; }

.top .ftoggle { display: none; margin-left: auto; height: 30px; }
.metro { display: flex; align-items: center; gap: 8px; flex: 1 1 300px; min-width: 0; max-width: 520px; }
.metro .search { flex: 0 1 220px; min-width: 150px; }
.metro .chips { flex: 1; }
.chip.small { height: 28px; padding: 0 9px; font-size: 13px; }
.results .tag { display: inline-block; margin-right: 6px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 11px; }
.results .chk { color: var(--accent); width: 14px; display: inline-block; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.dot[data-cat="bus"] { background: var(--p1); }
.dot[data-cat="prem"] { background: var(--p2); }
.dot[data-cat="dlx"] { background: var(--p3); }
.dot[data-cat="lux"] { background: var(--p4); }
.dot[data-cat="elt"] { background: var(--p5); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
.price { display: flex; align-items: center; gap: 10px; }
.price .label { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.range { position: relative; width: 190px; height: 24px; }
.range::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.range .fill { position: absolute; top: 10px; height: 4px; border-radius: 2px; background: var(--accent); }
.range input { position: absolute; left: 0; top: 0; width: 100%; height: 24px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.range input::-webkit-slider-runnable-track { background: none; height: 24px; }
.range input::-moz-range-track { background: none; height: 24px; }
.range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--surface); background: var(--accent); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
.range input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); background: var(--accent); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
.pval { min-width: 120px; font-variant-numeric: tabular-nums; }
.pin { stroke: var(--surface); stroke-width: 1.5px; pointer-events: none; }
.pin[data-cat="bus"] { fill: var(--p1); }
.pin[data-cat="prem"] { fill: var(--p2); }
.pin[data-cat="dlx"] { fill: var(--p3); }
.pin[data-cat="lux"] { fill: var(--p4); }
.pin[data-cat="elt"] { fill: var(--p5); }
.xf { display: none; flex-wrap: wrap; gap: 8px 22px; width: 100%; }
.xf.open { display: flex; }
.xf .segrow .chip { height: 28px; padding: 0 10px; font-size: 13px; }
.devq { height: 30px; width: 190px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.lnks { display: flex; flex-wrap: wrap; gap: 8px; }
.lnks a.btn { height: 32px; }
.lnks a.btn.alt { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.zring, .zhov { fill: none; pointer-events: none; }
.zring { stroke: var(--surface); stroke-width: 3.5px; filter: drop-shadow(0 0 2px rgba(0,0,0,.65)); }
.zhov { stroke: var(--ink); stroke-width: 1.8px; }
.dev { color: var(--muted); margin-top: 2px; }
.approx { font-size: 12.5px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.mini { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.sect p.txt { margin: 0; overflow-wrap: anywhere; }
.sect .sub { color: var(--muted); font-size: 12.5px; margin: 0; }
.zlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.zrow { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; }
.zrow:hover { border-color: var(--muted); }
.zrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zrow .pr { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.zrow.off { opacity: .5; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }

@media (max-width: 759px) {
  .hint { display: none; }
  .top .ftoggle { display: inline-flex; }
  .filters { display: none; }
  .filters.open { display: flex; }
  .metro { flex-wrap: wrap; max-width: none; }
  .metro .search { flex: 1 1 100%; }
  .range { width: 150px; }
  .count { margin-left: 0; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 52%; z-index: 10;
    border-radius: 14px 14px 0 0; box-shadow: var(--shadow); transform: translateY(104%); transition: transform .22s ease; visibility: hidden;
  }
  .panel.open { transform: none; visibility: visible; }
  .pclose {
    display: grid; place-items: center; position: absolute; top: 8px; right: 8px; width: 34px; height: 34px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer;
  }
  .pname { padding-right: 40px; }
  .src { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .dist { transition: none; }
}
</style>

<div class="app">
  <div class="top">
    <span class="brand">Миррион</span>
    <h1 class="title">Карта районов и ЖК Москвы</h1>
    <span class="count" id="count" aria-live="polite"></span>
    <button type="button" class="chip ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">Фильтры</button>
  </div>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" autocomplete="off" placeholder="Найти район, ЖК или застройщика" aria-label="Найти район, ЖК или застройщика по названию">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="metro">
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13 5 4l3 6 3-6 3 9"/></svg>
        <input id="mq" type="text" role="combobox" aria-expanded="false" aria-controls="mres" aria-autocomplete="list" autocomplete="off" placeholder="Станция метро" aria-label="Выбрать станции метро">
        <ul class="results" id="mres" role="listbox" aria-multiselectable="true" hidden></ul>
      </div>
      <div class="chips" id="mchips" aria-label="Выбранные станции"></div>
    </div>
    <div class="chips okrug" id="okrugs" role="group" aria-label="Административные округа"></div>
  </div>

  <div class="filters" id="filters">
    <div class="segrow">
      <span class="label">Сегмент района</span>
      <div class="chips" id="segs" role="group" aria-label="Сегмент жилья"></div>
    </div>
    <div class="segrow">
      <span class="label">ЖК</span>
      <button type="button" class="chip" id="ztoggle" aria-pressed="true">На карте</button>
      <div class="chips" id="cats" role="group" aria-label="Класс ЖК"></div>
    </div>
    <div class="price" role="group" aria-label="Средняя цена за квадратный метр">
      <span class="label">Цена за м²</span>
      <div class="range">
        <div class="fill" id="pfill"></div>
        <input type="range" id="plo" min="0" max="1000" step="1" value="0" aria-label="Минимальная средняя цена за м²">
        <input type="range" id="phi" min="0" max="1000" step="1" value="1000" aria-label="Максимальная средняя цена за м²">
      </div>
      <span class="pval" id="pval"></span>
    </div>
    <button type="button" class="chip" id="xtoggle" aria-expanded="false" aria-controls="xf">Ещё фильтры</button>
    <div class="xf" id="xf"></div>
    <span class="hint">Колесо мыши меняет масштаб, перетаскивание сдвигает карту</span>
  </div>

  <div class="stage" id="stage">
    <div class="mapwrap" id="wrap">
      <svg id="map" role="img" aria-label="Карта районов Москвы"></svg>
      <div class="zoom">
        <button id="zin" type="button" aria-label="Приблизить"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="zout" type="button" aria-label="Отдалить"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
        <button id="zfit" type="button" aria-label="Показать всю Москву"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-label="Карточка района или ЖК"></aside>
  </div>
</div>

<script>

  else if (e.key === 'ArrowUp') { e.preventDefault(); mActive = Math.max(0, mActive - 1); paintMetroActive(); }
  else if (e.key === 'Enter') { if (mActive >= 0 && mList[mActive]) { e.preventDefault(); toggleMetro(mList[mActive]); } }
  else if (e.key === 'Escape') { closeMetro(); }
  else if (e.key === 'Backspace' && !mq.value && metroSet.size) { toggleMetro(Array.from(metroSet).pop()); }
});

/* ---------- search (districts and ЖК) ---------- */
var q = $('q'), resBox = $('results');
var active = -1, resList = [];
function closeResults() { resBox.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; q.removeAttribute('aria-activedescendant'); }
function paintActive() {
  Array.from(resBox.children).forEach(function (li, i) { li.setAttribute('aria-selected', i === active ? 'true' : 'false'); });
  if (active >= 0 && resBox.children[active]) { q.setAttribute('aria-activedescendant', resBox.children[active].id); resBox.children[active].scrollIntoView({ block: 'nearest' }); }
}
function wordStart(key, s) { return key.split(/[\s\-«»"()]+/).some(function (w) { return w.indexOf(s) === 0; }) ? 0 : 1; }
function runSearch() {
  var s = norm(q.value.trim());
  resBox.textContent = '';
  if (!s) { closeResults(); return; }
  var ds = D.filter(function (d) {
    return d.key.indexOf(s) !== -1 || norm(d.ao) === s || norm(AO_NAME[d.ao]).indexOf(s) === 0;
  }).sort(function (a, b) { return wordStart(a.key, s) - wordStart(b.key, s) || a.n.localeCompare(b.n, 'ru'); }).slice(0, 8);
  var zs = ZHK.filter(function (z) { return z.key.indexOf(s) !== -1; })
    .sort(function (a, b) { return wordStart(a.key, s) - wordStart(b.key, s) || a.n.localeCompare(b.n, 'ru'); }).slice(0, 10);
  resList = ds.map(function (d) { return { d: d }; }).concat(zs.map(function (z) { return { z: z }; }));
  if (!resList.length) resBox.append(el('li', { class: 'none', role: 'option', 'aria-disabled': 'true' }, 'Ничего не нашлось'));
  resList.forEach(function (it, i) {
    var left = it.d ? el('span', { text: it.d.n }) : el('span', null, el('span', { class: 'tag', text: 'ЖК' }), it.z.n);
    var right = it.d ? it.d.ao : (it.z.metro || it.z.dn || '');
    resBox.append(el('li', {
      role: 'option', id: 'opt' + i, 'aria-selected': 'false',
      onmousedown: function (ev) { ev.preventDefault(); choose(it); }
    }, left, el('span', { class: 'ao', text: right })));
  });
  active = resList.length ? 0 : -1; paintActive();
  resBox.hidden = false; q.setAttribute('aria-expanded', 'true');
}
function choose(it) {
  closeResults(); q.blur();
  if (it.d) {
    q.value = it.d.n;
    if (!it.d.vis) clearFilters();
    select(it.d.id, true);
  } else {
    q.value = it.z.n;
    if (!it.z.mv) clearFilters();
    if (!showZ) { showZ = true; refresh(); }
    selectZhk(it.z.id, true);
  }
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', function () { if (q.value) runSearch(); q.select(); });
q.addEventListener('blur', function () { setTimeout(closeResults, 120); });
q.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (resBox.hidden) runSearch(); else { active = Math.min(resList.length - 1, active + 1); paintActive(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); paintActive(); }
  else if (e.key === 'Enter') { if (active >= 0 && resList[active]) { e.preventDefault(); choose(resList[active]); } }
  else if (e.key === 'Escape') { closeResults(); }
});

/* ---------- selection + panel ---------- */
var panel = $('panel');
var unsubNotes = null, notesTok = 0;
var SRC_LINE = 'Границы районов: gis-lab.info, данные OpenStreetMap. Положение ЖК: координаты домов с ДОМ.РФ. Данные на 13.10.2026.';

function select(id, fly) {
  sel = id; selZ = null;
  var d = id ? byId.get(id) : null;
  selp.setAttribute('d', d ? d.d : '');
  panel.classList.toggle('open', !!d);
  renderPanel();
  watchNotes(noteKey());
  if (d && (fly || mobileMQ.matches)) { touched = true; fitBox(d.bx, d.by, d.bx + d.w, d.by + d.h, 420, mobileMQ.matches ? 36 : 70); }
  updateLabels(); updatePins();
}
function selectZhk(id, fly) {
  var z = zById.get(id); if (!z) return;
  selZ = id; sel = z.d ? z.d.id : null;
  selp.setAttribute('d', z.d ? z.d.d : '');
  panel.classList.add('open');
  renderPanel();
  watchNotes(noteKey());
  if (z.hasPos && z.vis && (fly || mobileMQ.matches)) { touched = true; centerOn(z.x, z.y, 420); }
  updateLabels(); updatePins();
}

function badgeNode(seg) { return el('span', { class: 'badge' }, el('span', { class: 'sw', 'data-seg': seg }), SEGN[seg]); }
function closeIcon() {
  var s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('width', '14'); s.setAttribute('height', '14');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.8'); s.setAttribute('stroke-linecap', 'round');
  var p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M3.5 3.5l9 9M12.5 3.5l-9 9'); s.appendChild(p); return s;
}
function closeBtn() { return el('button', { type: 'button', class: 'pclose', 'aria-label': 'Закрыть карточку', onclick: function () { select(null); } }, closeIcon()); }
function notesSection(title) { return el('section', { class: 'sect', 'aria-label': 'Заметки брокеров' }, el('h3', { text: title }), el('div', { id: 'notesbox' })); }

function zRow(z) {
  return el('li', null, el('button', { type: 'button', class: 'zrow' + (z.mv ? '' : ' off'), onclick: function () { if (!z.mv) return; selectZhk(z.id, true); } },
    el('span', { class: 'dot', 'data-cat': z.cat }), el('span', { class: 'nm', text: z.n }), el('span', { class: 'pr', text: z.pa ? fmtN(z.pa) : '' })));
}
function renderZList() {
  var box = $('zlistbox'); if (!box) return;
  box.textContent = '';
  var d = sel && !selZ ? byId.get(sel) : null;
  var list = d ? ZHK.filter(function (z) { return z.d === d; }) : ZHK.filter(function (z) { return !z.hasPos; });
  list.sort(function (a, b) { return (b.pa || 0) - (a.pa || 0); });
  if (!list.length) { box.append(el('p', { class: 'empty', text: 'В этом районе пока нет ЖК из списка.' })); return; }
  box.append(el('ul', { class: 'zlist' }, list.map(zRow)));
}

function renderPanel() {
  panel.textContent = '';
  var d = sel ? byId.get(sel) : null;
  var z = selZ ? zById.get(selZ) : null;
  if (z) { renderZhkCard(z, d); return; }
  if (!d) {
    panel.append(
      el('div', null, el('div', { class: 'eyebrow', text: 'Ничего не выбрано' }),
        el('h2', { class: 'pname', text: 'Москва: районы и ЖК' })),
      el('ol', { class: 'steps' },
        el('li', { text: 'Нажмите на район или на точку ЖК, либо найдите по названию.' }),
        el('li', { text: 'Выберите метро, цену, срок сдачи, отделку, сделки и другие фильтры: на карте останутся подходящие ЖК.' }),
        el('li', { text: 'В карточке ЖК есть описание, продажи, школы и вузы рядом и ссылки на ЦИАН, ДОМ.РФ и сайт.' }),
        el('li', { text: 'В карточке района виден сегмент и список ЖК.' })),
      (function () {
        var off = ZHK.filter(function (x) { return !x.hasPos; });
        if (!off.length) return null;
        return el('section', { class: 'sect' }, el('h3', { text: 'ЖК без точки на карте' }),
          el('p', { class: 'sub', text: 'Для этих проектов нет координат, их можно открыть списком.' }), el('div', { id: 'zlistbox' }));
      })(),
      el('div', { class: 'src', text: SRC_LINE })
    );
    renderZList();
    return;
  }
  panel.append(
    closeBtn(),
    el('div', null, el('div', { class: 'eyebrow', text: d.ao + ', ' + AO_NAME[d.ao] + ' округ' }), el('h2', { class: 'pname', text: d.n })),
    el('dl', { class: 'facts', id: 'facts' }),
    el('section', { class: 'sect', 'aria-label': 'ЖК в районе' }, el('h3', { text: 'ЖК в районе' }), el('div', { id: 'zlistbox' })),
    el('div', { class: 'src', text: SRC_LINE })
  );
  renderFacts(); renderZList();
  renderNotesShell();
}

function renderFacts() {
  var f = $('facts'); if (!f || !sel || selZ) return;
  var d = byId.get(sel);
  f.textContent = '';
  f.append(el('dt', { text: 'Сегмент' }));
  var dd = el('dd');
  if (isEditor && db) {
    var s = el('select', { class: 'segsel', id: 'segsel', 'aria-label': 'Сегмент района',
      onchange: function () { setSegment(d.id, s.value); } });
    SEGS.forEach(function (o) { var op = el('option', { value: o.k, text: o.n }); if (o.k === d.seg) op.selected = true; s.append(op); });
    dd.append(s);
    if (override[d.id]) dd.append(el('div', null, el('button', { type: 'button', class: 'linkbtn', onclick: function () { resetSegment(d.id); } }, 'Вернуть исходный сегмент')));
  } else dd.append(badgeNode(d.seg));
  f.append(dd, el('dt', { text: 'Площадь' }), el('dd', { text: fmtArea(d.a) }));
}

function lnk(u, t, alt) { return /^https?:\/\//i.test(u || '') ? el('a', { class: 'btn' + (alt ? ' alt' : ''), href: u, target: '_blank', rel: 'noopener noreferrer' }, t) : null; }
function renderZhkCard(z, d) {
  var facts = el('dl', { class: 'facts' });
  function row(t, v) { if (v == null || v === '') return; facts.append(el('dt', { text: t }), el('dd', null, v)); }
  row('Район', d ? el('button', { type: 'button', class: 'linkbtn', onclick: function () { select(d.id, true); } }, d.n) : (z.dn || ''));
  row('Округ', z.ao ? z.ao + (AO_NAME[z.ao] ? ', ' + AO_NAME[z.ao] : '') : '');
  row('Адрес', z.addr);
  row('Метро', z.metro ? z.metro + (z.wm ? ', ' + z.wm + ' мин пешком' : '') : '');
  row('Цена за м²', z.pa ? (z.pm && z.pm !== z.pa ? 'от ' + fmtN(z.pm) + ', в среднем ' + fmtN(z.pa) + ' тыс. ₽' : fmtN(z.pa) + ' тыс. ₽') : '');
  row('Квартиры, цена', z.pl != null ? (z.ph != null && z.ph !== z.pl ? 'от ' + z.pl.toLocaleString('ru-RU') + ' до ' + z.ph.toLocaleString('ru-RU') + ' млн ₽' : z.pl.toLocaleString('ru-RU') + ' млн ₽') : '');
  row('Сделки (рейтинг)', z.sep != null ? z.sep + ' в сентябре' + (z.aug != null ? ', ' + z.aug + ' в августе' : '') : '');
  row('Распродано', z.sold != null ? z.sold + '% (по ключевым корпусам, ДОМ.РФ)' : '');
  row('В продаже', z.cnt ? z.cnt + ' кв. на ЦИАН' + (z.sh != null ? ', около ' + z.sh + '% от всех' : '') : '');
  row('Срок сдачи', z.due);
  row('Этажность', z.fl ? 'до ' + z.fl : '');
  row('Отделка', z.fin);
  row('Квартир в ЖК', z.flats ? String(z.flats) : '');
  row('Вузов в 5 км', z.u5 != null ? String(z.u5) : '');
  row('Окружение, 1 км', z.tr != null ? 'транспорт ' + z.tr + ', зелень ' + z.gr + ', инфраструктура ' + z.inf + ' из 10' : '');
  row('Группа', (z.grp === 'rest') ? 'остальные ЖК' : z.grp === 'hand' ? 'топ-60, добавлен вручную' : z.grp === 'new' ? 'добавлен вручную 14.10.2026' : 'топ-60');

  var sch = splitList(z.sch), uni = splitList(z.uni);
  var isCian = /^https?:\/\/([a-z0-9-]+\.)*cian\.ru(\/|$)/i.test(z.url || '');
  var okUrl = /^https?:\/\//i.test(z.url || '');

  panel.append(
    closeBtn(),
    el('div', null,
      el('div', { class: 'eyebrow' }, el('span', { class: 'badge' }, el('span', { class: 'dot', 'data-cat': z.cat }), 'Класс: ' + CATN[z.cat])),
      el('h2', { class: 'pname', text: z.n }),
      z.dev ? el('div', { class: 'dev', text: 'Застройщик: ' + z.dev }) : null),
    facts,
    z.hasPos
      ? el('div', { class: 'approx', text: z.basis === 'exact' ? 'Точка стоит по координатам дома на ДОМ.РФ.' : 'Точка поставлена примерно: рядом со станцией метро.' })
      : el('div', { class: 'approx', text: 'На карте не показан: координат нет.' }),
    z.brief ? el('section', { class: 'sect' }, el('h3', { text: 'Описание' }), el('p', { class: 'txt', text: z.brief })) : null,
    (sch.length || uni.length) ? el('section', { class: 'sect' }, el('h3', { text: 'Школы и вузы рядом' }),
      sch.length ? el('p', { class: 'sub', text: 'Школы до 1 км, расстояние в метрах' }) : null,
      sch.length ? el('ul', { class: 'mini' }, sch.map(function (x) { return el('li', { text: x }); })) : null,
      uni.length ? el('p', { class: 'sub', text: 'Вузы в радиусе 5 км, расстояние по прямой в км' }) : null,
      uni.length ? el('ul', { class: 'mini' }, uni.map(function (x) { return el('li', { text: x }); })) : null) : null,
    el('div', { class: 'lnks' },
      lnk(z.lc, 'ЦИАН', false), lnk(z.ld, 'ДОМ.РФ', true), lnk(z.ls, z.lss && /не подтверждён|главная/.test(z.lss) ? 'Сайт (не подтверждён)' : 'Оф. сайт', true)),
    z.note ? el('p', { class: 'sub', text: z.note }) : null,
    el('div', { class: 'src', text: SRC_LINE })
  );
  renderNotesShell();
}

function setSegment(id, key) {
  if (!db) return;
  var d = byId.get(id);
  override[id] = key; d.seg = key; refresh(); renderFacts();
  db.doc('segments/' + id).set({ seg: key }).catch(function () {
    delete override[id]; d.seg = d.base; refresh(); renderFacts();
    setStatus('Не удалось сохранить сегмент. Проверьте права на редактирование.', true);
  });
}
function resetSegment(id) {
  if (!db) return;
  var d = byId.get(id);
  db.doc('segments/' + id).delete().then(function () { delete override[id]; d.seg = d.base; refresh(); renderFacts(); }, function () { setStatus('Не удалось вернуть сегмент.', true); });
}

/* ---------- notes ---------- */
var notesList = null, statusEl = null, noteBox = null, sendBtn = null;
function setStatus(msg, err) { if (!statusEl) return; statusEl.textContent = msg || ''; statusEl.className = 'status' + (err ? ' err' : ''); }

function renderNotesShell() {
  var box = $('notesbox'); if (!box) return;
  box.textContent = '';
  notesList = null; statusEl = null; noteBox = null; sendBtn = null;
  if (!capsDone) { box.append(el('p', { class: 'empty', text: 'Загружаю заметки…' })); return; }
  if (!db) { box.append(el('p', { class: 'empty', text: 'Заметки доступны, когда карта открыта по ссылке под вашим аккаунтом.' })); return; }
  notesList = el('ul', { class: 'notes' }, el('li', { class: 'empty', text: 'Загружаю заметки…' }));
  box.append(notesList);
  if (canWrite === false) {
    box.append(el('p', { class: 'empty', text: 'Добавлять заметки могут участники с правом редактирования.' }));
    return;
  }
  noteBox = el('textarea', { id: 'notebox', maxlength: '1000', rows: '3',
    placeholder: selZ ? 'Что важно знать об этом ЖК: застройщик, нюансы сделки, кому подходит' : 'Что важно знать об этом районе: транспорт, застройщики, инфраструктура',
    'aria-label': 'Новая заметка', oninput: function () { sendBtn.disabled = !noteBox.value.trim(); } });
  sendBtn = el('button', { type: 'button', class: 'btn', disabled: true, onclick: addNote }, 'Добавить заметку');
  statusEl = el('div', { class: 'status', role: 'status' });
  box.append(el('div', { class: 'compose' }, noteBox, sendBtn, statusEl));
}

function addNote() {
  var id = noteKey(), text = noteBox.value.trim();
  if (!id || !text || !db) return;
  sendBtn.disabled = true; setStatus('Сохраняю…');
  db.collection('notes/' + id + '/entries').add({ text: text.slice(0, 1000), by: myId || '', at: Date.now() }).then(function () {
    if (noteBox && noteKey() === id) { noteBox.value = ''; setStatus('Заметка сохранена.'); }
  }, function () {
    setStatus('Не удалось сохранить заметку. Проверьте права на запись.', true);
    if (noteBox) sendBtn.disabled = !noteBox.value.trim();
  });
}

function watchNotes(id) {
  if (unsubNotes) { try { unsubNotes(); } catch (e) {} unsubNotes = null; }
  if (!db || !id) return;
  try {
    unsubNotes = db.collection('notes/' + id + '/entries').orderBy('at', 'desc').limit(200).onSnapshot(function (snap) {
      var list = snap.docs.map(function (x) { var v = x.data() || {}; return { id: x.id, text: String(v.text || ''), by: v.by || '', at: v.at || 0 }; });
      renderNotes(id, list);
    }, function () { if (notesList) { notesList.textContent = ''; notesList.append(el('li', { class: 'empty', text: 'Не удалось загрузить заметки.' })); } });
  } catch (e) {}
}

function renderNotes(id, list) {
  var tok = ++notesTok;
  var ids = Array.from(new Set(list.map(function (n) { return n.by; }).filter(Boolean)));
  var prof = user && ids.length ? user.profiles(ids) : Promise.resolve({});
  prof.then(function (ps) {
    if (tok !== notesTok || noteKey() !== id || !notesList) return;
    notesList.textContent = '';
    if (!list.length) { notesList.append(el('li', { class: 'empty', text: selZ ? 'Пока нет заметок. Первая заметка поможет коллегам лучше понять этот ЖК.' : 'Пока нет заметок. Первая заметка поможет следующему брокеру быстрее разобраться в районе.' })); return; }
    list.forEach(function (n) {
      var who = (ps[n.by] && ps[n.by].name) || 'Коллега';
      var when = n.at ? new Date(n.at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      var meta = el('div', { class: 'meta' }, el('span', { class: 'who', text: who }), el('span', { text: when }));
      if (db && (isEditor || (myId && n.by === myId))) {
        var armed = false;
        var del = el('button', { type: 'button', class: 'linkbtn del' }, 'Удалить');
        del.addEventListener('click', function () {
          if (!armed) { armed = true; del.textContent = 'Точно удалить?'; setTimeout(function () { armed = false; del.textContent = 'Удалить'; }, 3500); return; }
          db.doc('notes/' + id + '/entries/' + n.id).delete().catch(function () { setStatus('Не удалось удалить заметку.', true); });
        });
        meta.append(del);
      }
      notesList.append(el('li', { class: 'note' }, meta, el('p', { text: n.text })));
    });
  });
}

/* ---------- capabilities ---------- */
(function caps() {
  var c = null;
  var finish = function () { capsDone = true; renderPanel(); watchNotes(noteKey()); };
  if (!c || !c.use) { finish(); return; }
  Promise.resolve().then(function () { return c.use('user').catch(function () { return null; }); }).then(function (u) {
    user = u;
    return u ? Promise.all([u.id(), u.canEdit(), u.can('data.write')]).catch(function () { return [null, false, null]; }) : [null, false, null];
  }).then(function (r) {
    myId = r[0]; isEditor = !!r[1]; canWrite = r[2];
    return c.use('db').catch(function () { return null; });
  }).then(function (store) {
    db = store;
    if (db) {
      try {
        db.collection('segments').onSnapshot(function (snap) {
          override = {};
          snap.docs.forEach(function (x) { var v = x.data(); if (v && SEGN[v.seg]) override[x.id] = v.seg; });
          D.forEach(function (d) { d.seg = override[d.id] || d.base; });
          refresh(); renderFacts();
        }, function () {});
      } catch (e) {}
    }
    finish();
  }).catch(finish);
})();

/* ---------- init ---------- */
function init() {
  setBounds();
  var v = viewport();
  if (v.w > 0) { var f = boxView(BB[0], BB[1], BB[2], BB[3], 14); k = f.k; tx = f.tx; ty = f.ty; }
  refresh(); renderPanel(); apply();
}
if (window.ResizeObserver) {
  var first = true;
  new ResizeObserver(function () {
    setBounds();
    if (first || !touched) { var f = boxView(BB[0], BB[1], BB[2], BB[3], 14); k = f.k; tx = f.tx; ty = f.ty; first = false; }
    apply();
  }).observe(wrap);
}
init();
})();
</script>
